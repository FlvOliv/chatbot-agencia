# Configuração versionada do eval comparativo da Malu.
# Mudou algo aqui → registrar no relatório (o summary.md copia este bloco).

seed: 20261116            # ordem dos casos e telefones sintéticos
k: 1                      # repetições por caso (k=3 quando a cota permitir)

providers:
  gemini:
    model: gemini-2.5-flash
  groq:
    # Era llama-3.3-70b-versatile: a conta free do Groq dá 404 model_not_found
    # pra ele (16/11/2026). gpt-oss-120b é o mesmo modelo da perna Cerebras de
    # produção. Limite medido nos cabeçalhos: 8.000 tokens/min, 1.000 req/dia.
    model: openai/gpt-oss-120b
    sleep_between_turns_s: 60   # 1 turno ≈ 7–9k tokens; o TPM de 8k pede ~1 turno/min

# Igual ao caminho de produção da Malu. COLETA_STATE_ENABLED liga a extração
# da ficha a cada turno (Alavanca B). Confirmar no Railway se está ligada lá.
coleta_state_enabled: true

# Ritmo: o free tier dos dois provedores limita requisições e tokens por minuto.
sleep_between_turns_s: 6
sleep_between_cases_s: 10

# Retry com backoff em rate limit por minuto (429). Cota DIÁRIA estourada não
# tem retry: a rodada para, o caso em andamento é descartado e o --resume
# retoma dali no dia seguinte.
retry:
  max_retries: 3
  backoff_s: [20, 40, 80]

# Travas antes de gastar cota/dinheiro.
limits:
  max_llm_calls_per_provider: 120  # por execução; a cota diária do provedor também para a rodada
  max_cost_usd: 5.00               # corta a rodada se o custo estimado acumulado passar disso

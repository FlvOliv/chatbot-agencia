# Preço por 1M de tokens (USD). Cada entrada tem fonte e data da consulta.
# Não chutar: se a fonte oficial não confirmar, `status` diz isso e o relatório
# carrega a ressalva.

# Fora do eval desde 16/11/2026: free tier de ~20 req/dia e billing pede cartão. Mantido como registro.
gemini-2.5-flash:
  input_per_m: 0.30
  output_per_m: 2.50          # inclui tokens de "thinking"
  source: https://aistudio.google.com/docs/pricing
  checked: 2026-11-16
  status: oficial
  notes: >
    Tier pago. No free tier o conteúdo é usado pra melhorar os produtos do Google
    (no pago, não). A mesma página avisa que o gemini-2.5-flash está depreciado:
    a partir de 2026-12-01 as chamadas são roteadas para o Gemini 3.5 Flash-Lite
    e cobradas no preço dele.

openai/gpt-oss-120b:
  input_per_m: 0.15
  output_per_m: 0.60          # inclui os tokens de raciocínio (vêm dentro de completion_tokens)
  source: https://console.groq.com/docs/model/openai/gpt-oss-120b
  checked: 2026-11-16
  status: oficial
  notes: >
    Preço do Groq (cached input US$ 0,075/M, não usado no cálculo). Limites da conta free medidos
    nos cabeçalhos x-ratelimit em 2026-11-16: 8.000 tokens/min e 1.000 requisições/dia.
    A página de rate limits lista 200K tokens/dia.

openai/gpt-oss-20b:
  input_per_m: 0.075
  output_per_m: 0.30          # inclui os tokens de raciocínio (vêm dentro de completion_tokens)
  source: https://console.groq.com/docs/model/openai/gpt-oss-20b
  checked: 2026-11-16
  status: oficial
  notes: >
    Preço do Groq (cached input US$ 0,037/M, não usado no cálculo). Contexto de 131K,
    saída máxima de 65K. Limites da tabela de rate limits: 30 req/min, 1.000 req/dia,
    8K tokens/min, 200K tokens/dia (mesmos do 120b).

# Fora do eval desde 16/11/2026: a conta free do Groq dá 404 model_not_found. Mantido como registro.
llama-3.3-70b-versatile:
  input_per_m: 0.59
  output_per_m: 0.79
  source: https://www.getmaxim.ai/bifrost/llm-cost-calculator/provider/groq/model/llama-3.3-70b-versatile
  checked: 2026-11-16
  status: nao_confirmado_na_fonte_oficial
